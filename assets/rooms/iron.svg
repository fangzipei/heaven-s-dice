<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#281d18"/>
    <stop offset=".52" stop-color="#17120f"/>
    <stop offset="1" stop-color="#060506"/>
  </linearGradient>
  <radialGradient id="wallGlow" cx=".5" cy=".52" r=".56">
    <stop offset="0" stop-color="#ff6a31" stop-opacity=".34"/>
    <stop offset=".55" stop-color="#ff6a31" stop-opacity=".07"/>
    <stop offset="1" stop-color="#ff6a31" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="table" x1=".16" y1="0" x2=".82" y2="1">
