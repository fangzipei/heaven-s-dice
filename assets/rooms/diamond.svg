<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" preserveAspectRatio="xMidYMid slice">

<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#143544"/>
    <stop offset=".52" stop-color="#0c1b24"/>
    <stop offset="1" stop-color="#03080c"/>
  </linearGradient>
  <radialGradient id="wallGlow" cx=".5" cy=".52" r=".56">
    <stop offset="0" stop-color="#78e4f4" stop-opacity=".34"/>
    <stop offset=".55" stop-color="#78e4f4" stop-opacity=".07"/>
    <stop offset="1" stop-color="#78e4f4" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="table" x1=".16" y1="0" x2=".82" y2="1">
    <stop offset="0" stop-color="#6a9aa7"/>
    <stop offset=".4" stop-color="#315a68"/>
    <stop offset="1" stop-color="#0e2630"/>
  </linearGradient>
  <linearGradient id="topGlow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d0f8ff" stop-opacity=".26"/>
    <stop offset=".3" stop-color="#d0f8ff" stop-opacity=".03"/>
    <stop offset="1" stop-color="#d0f8ff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="edgeGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a4e0eb"/>
    <stop offset="1" stop-color="#041015"/>
  </linearGradient>
  <radialGradient id="vignette" cx=".5" cy=".48" r=".72">
    <stop offset=".42" stop-color="#000" stop-opacity="0"/>
    <stop offset=".8" stop-color="#000" stop-opacity=".38"/>
    <stop offset="1" stop-color="#000" stop-opacity=".82"/>
  </radialGradient>
  <radialGradient id="torch" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#78e4f4" stop-opacity=".8"/>
    <stop offset=".3" stop-color="#78e4f4" stop-opacity=".3"/>
    <stop offset="1" stop-color="#78e4f4" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur30" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="30"/>
  </filter>
  <filter id="blur12" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="12"/>
  </filter>
  <filter id="blur4" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="58" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".12"/></feComponentTransfer>
    <feBlend in="SourceGraphic" mode="overlay"/>
  </filter>
  <pattern id="woodgrain" width="180" height="90" patternUnits="userSpaceOnUse" patternTransform="rotate(2)">
    <path d="M0 20 C55 4 96 35 180 16 M0 52 C50 39 110 66 180 44 M0 81 C56 68 120 92 180 70"
