<svg xmlns="http://www.w3.org/2000/svg" width="600" height="760" viewBox="0 0 600 760">
<defs>
  <radialGradient id="aura" cx=".5" cy=".46" r=".55">
    <stop offset="0" stop-color="#c9b8f2" stop-opacity=".46"/>
    <stop offset=".5" stop-color="#0d0818" stop-opacity=".14"/>
    <stop offset="1" stop-color="#0d0818" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="floorGlow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#c9b8f2" stop-opacity=".22"/>
    <stop offset="1" stop-color="#c9b8f2" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="cape" x1=".2" y1="0" x2=".8" y2="1">
    <stop offset="0" stop-color="#211a17"/><stop offset=".52" stop-color="#0d0a09"/><stop offset="1" stop-color="#050404"/>
  </linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c9b8f2" stop-opacity=".9"/><stop offset=".5" stop-color="#c9b8f2" stop-opacity=".14"/>
    <stop offset="1" stop-color="#0d0818" stop-opacity=".7"/>
  </linearGradient>
  <filter id="blur24" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="blur8" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="blur2" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="2.5"/></filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" seed="17"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".1"/></feComponentTransfer>
    <feBlend in="SourceGraphic" mode="soft-light"/>
  </filter>
  
  <linearGradient id="shroud" x1=".2" y1="0" x2=".8" y2="1">
    <stop offset="0" stop-color="#3c3258"/><stop offset=".55" stop-color="#1c1630"/>
    <stop offset="1" stop-color="#090612"/>
  </linearGradient>
  <linearGradient id="hoodEdge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#cbb6ff" stop-opacity=".75"/>
    <stop offset=".5" stop-color="#8d78c4" stop-opacity=".2"/>
    <stop offset="1" stop-color="#6a56a0" stop-opacity=".6"/>
  </linearGradient>
  <linearGradient id="vapour" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d6c8f5" stop-opacity=".42"/>
    <stop offset="1" stop-color="#8f7ac0" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f4ead0"/><stop offset=".45" stop-color="#cbb689"/>
    <stop offset="1" stop-color="#7a6742"/>
  </linearGradient>
  <radialGradient id="panGlow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#cbb6ff" stop-opacity=".5"/>
    <stop offset="1" stop-color="#8a74c8" stop-opacity="0"/>
  </radialGradient>

</defs>
<ellipse cx="300" cy="330" rx="275" ry="335" fill="url(#aura)"/>
<ellipse cx="300" cy="715" rx="300" ry="80" fill="url(#floorGlow)"/>

<g>
  <!-- 悬在空中的下半身：袍角化进雾里，暗示它没有落地 -->
  <g opacity=".8">
    <path d="M150 588 Q300 664 452 588 L492 760 L108 760Z" fill="url(#vapour)"/>
    <path d="M196 604 Q300 692 404 604 L420 760 L180 760Z" fill="url(#vapour)" opacity=".85"/>
