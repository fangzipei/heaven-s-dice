  <!-- 兜帽后的冷光：把剪影从背景里剥出来 -->
  <ellipse cx="300" cy="300" rx="120" ry="150" fill="#a48ed6" opacity=".14" filter="url(#blur24)"/>

  <!-- 左侧轮廓光 -->
