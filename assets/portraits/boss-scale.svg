  <g transform="rotate(12 452 186)" opacity="0.85"><rect x="437.0" y="171.0" width="30" height="30" rx="6.0" fill="#efe6d0" stroke="#241a34" stroke-width="1.1" opacity=".92"/><circle cx="444.2" cy="178.2" r="2.2" fill="#241a34"/><circle cx="444.2" cy="186.0" r="2.2" fill="#241a34"/><circle cx="444.2" cy="193.8" r="2.2" fill="#241a34"/><circle cx="459.8" cy="178.2" r="2.2" fill="#241a34"/><circle cx="459.8" cy="186.0" r="2.2" fill="#241a34"/><circle cx="459.8" cy="193.8" r="2.2" fill="#241a34"/></g><g transform="rotate(-8 408 162)" opacity="0.7"><rect x="395.0" y="149.0" width="26" height="26" rx="5.2" fill="#efe6d0" stroke="#241a34" stroke-width="1.1" opacity=".92"/><circle cx="401.2" cy="155.2" r="1.9" fill="#241a34"/><circle cx="414.8" cy="155.2" r="1.9" fill="#241a34"/><circle cx="401.2" cy="168.8" r="1.9" fill="#241a34"/><circle cx="414.8" cy="168.8" r="1.9" fill="#241a34"/></g><g transform="rotate(-20 470 226)" opacity="0.6"><rect x="459.0" y="215.0" width="22" height="22" rx="4.4" fill="#efe6d0" stroke="#241a34" stroke-width="1.1" opacity=".92"/><circle cx="464.3" cy="220.3" r="1.6" fill="#241a34"/><circle cx="475.7" cy="231.7" r="1.6" fill="#241a34"/></g>

  <!-- 长袍前襟的骰面刻纹 -->
  <g opacity=".6">
    <g transform="rotate(8 300 556)" opacity="1.0"><rect x="277.0" y="533.0" width="46" height="46" rx="9.2" fill="#302448" stroke="#cbb6ff" stroke-width="1.1" opacity=".92"/><circle cx="288.0" cy="544.0" r="3.4" fill="#cbb6ff"/><circle cx="312.0" cy="544.0" r="3.4" fill="#cbb6ff"/><circle cx="300.0" cy="556.0" r="3.4" fill="#cbb6ff"/><circle cx="288.0" cy="568.0" r="3.4" fill="#cbb6ff"/><circle cx="312.0" cy="568.0" r="3.4" fill="#cbb6ff"/></g>
  </g>
  <g fill="none" stroke="#cbb6ff" stroke-width="1" opacity=".2">
    <circle cx="300" cy="556" r="46"/><circle cx="300" cy="556" r="58" stroke-dasharray="4 9"/>
  </g>
</g>
