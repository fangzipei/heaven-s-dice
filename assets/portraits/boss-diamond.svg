  <!-- chest core -->
  <circle cx="300" cy="562" r="34" fill="#c9fbff" opacity=".2" filter="url(#blur8)"/>
  <path d="M300 526 L326 562 L300 598 L274 562Z" fill="url(#crystal)" stroke="#ecfeff" stroke-width="2"/>
