<svg xmlns="http://www.w3.org/2000/svg" width="240" height="300" viewBox="0 0 240 300">
  <defs>
    <linearGradient id="cupBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050a10"/>
      <stop offset=".07" stop-color="#08101a"/>
      <stop offset=".2" stop-color="#2f4a6a"/>
      <stop offset=".33" stop-color="#6d8097"/>
      <stop offset=".52" stop-color="#2f4a6a"/>
      <stop offset=".78" stop-color="#0d1a2a"/>
      <stop offset=".93" stop-color="#08101a"/>
      <stop offset="1" stop-color="#050a10"/>
    </linearGradient>
    <linearGradient id="cupVert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset=".28" stop-color="#fff" stop-opacity=".02"/>
      <stop offset=".62" stop-color="#000" stop-opacity=".08"/>
      <stop offset=".88" stop-color="#000" stop-opacity=".26"/>
      <stop offset="1" stop-color="#000" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="cupRim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#08101a"/>
      <stop offset=".24" stop-color="#bcd8ef"/>
      <stop offset=".44" stop-color="#dcecff"/>
      <stop offset=".72" stop-color="#bcd8ef"/>
      <stop offset="1" stop-color="#08101a"/>
    </linearGradient>
    <linearGradient id="cupBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".55"/>
      <stop offset=".3" stop-color="#bcd8ef" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#dcecff" stop-opacity=".5"/>
      <stop offset=".8" stop-color="#000" stop-opacity=".45"/>
      <stop offset="1" stop-color="#000" stop-opacity=".7"/>
    </linearGradient>
    <radialGradient id="cupCap" cx=".36" cy=".28" r=".85">
      <stop offset="0" stop-color="#7e8fa3"/>
      <stop offset=".52" stop-color="#2f4a6a"/>
      <stop offset="1" stop-color="#0d1a2a"/>
    </radialGradient>
    <radialGradient id="cupShadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000" stop-opacity=".7"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="contact" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="streak" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.4"/></filter>
    <clipPath id="cupBodyClip"><path d="M56 240 C58 202 62 140 74 92 L166 92 C178 140 182 202 184 240 A64 18 0 0 1 56 240 Z"/></clipPath>
  </defs>

  <!-- table contact -->
  <ellipse cx="121" cy="259" rx="82" ry="20" fill="url(#cupShadow)"/>
  <ellipse cx="120" cy="250" rx="66" ry="14" fill="#000" opacity=".6" filter="url(#contact)"/>

  <!-- wall -->
  <path d="M56 240 C58 202 62 140 74 92 L166 92 C178 140 182 202 184 240 A64 18 0 0 1 56 240 Z" fill="url(#cupBody)"/>
  <g clip-path="url(#cupBodyClip)">
    <g transform="translate(120 166)"></g>
    <path d="M56 240 C58 202 62 140 74 92 L166 92 C178 140 182 202 184 240 A64 18 0 0 1 56 240 Z" fill="url(#cupVert)"/>
    <path d="M83 98 C86 152 88 202 90 248" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="8" filter="url(#streak)"/>
    <path d="M172 96 C169 152 167 202 165 250" fill="none" stroke="#000" stroke-opacity=".42" stroke-width="13" filter="url(#streak)"/>
    <path d="M62 228 Q120 250 178 228" fill="none" stroke="#dcecff" stroke-opacity=".18" stroke-width="11" filter="url(#streak)"/>
    <path d="M71 138 Q120 152 169 138" fill="none" stroke="#1a2838" stroke-width="11"/>
    <path d="M71 138 Q120 152 169 138" fill="none" stroke="url(#cupBand)" stroke-width="11"/>
    <path d="M71 132.5 Q120 146.5 169 132.5" fill="none" stroke="#dcecff" stroke-opacity=".34" stroke-width="1.3"/>
    <path d="M71 143.5 Q120 157.5 169 143.5" fill="none" stroke="#000" stroke-opacity=".42" stroke-width="1.5"/>
    <path d="M58 216 Q120 232 182 216" fill="none" stroke="#1a2838" stroke-width="13"/>
    <path d="M58 216 Q120 232 182 216" fill="none" stroke="url(#cupBand)" stroke-width="13"/>
    <path d="M58 209.5 Q120 225.5 182 209.5" fill="none" stroke="#dcecff" stroke-opacity=".3" stroke-width="1.3"/>
    <path d="M58 222.5 Q120 238.5 182 222.5" fill="none" stroke="#000" stroke-opacity=".46" stroke-width="1.7"/>
    <ellipse cx="120" cy="176" rx="34" ry="34" fill="none" stroke="#dcecff" stroke-opacity=".16" stroke-width="1"/><ellipse cx="120" cy="176" rx="25" ry="25" fill="none" stroke="#dcecff" stroke-opacity=".12" stroke-width="1" stroke-dasharray="2 7"/>
    <g transform="translate(120 176)"><g fill="none" stroke="#dcecff" stroke-width="2.4" opacity=".8">
          <path d="M-20 18 C-2 12 10 14 15 2 C19 -8 6 -14 -3 -8 C-13 -1 -7 12 5 12 C18 12 24 2 19 -9"/>
          <circle cx="19" cy="-9" r="2.5" fill="#dcecff"/><path d="M21 -11 L28 -16 M21 -8 L28 -4"/>
        </g></g>
    <circle cx="120" cy="176" r="31" fill="#dcecff" opacity=".07" filter="url(#softGlow)"/>
  </g>

  <!-- rolled mouth resting on the table -->
  <path d="M56 240 A64 18 0 0 0 184 240" fill="none" stroke="url(#cupRim)" stroke-width="7" stroke-linecap="round"/>
  <path d="M58 238 A60 16 0 0 0 182 238" fill="none" stroke="#dcecff" stroke-opacity=".4" stroke-width="1.3"/>
  <path d="M60 234 A56 14 0 0 0 180 234" fill="none" stroke="#000" stroke-opacity=".46" stroke-width="3"/>
  <ellipse cx="120" cy="252" rx="54" ry="8" fill="#04070c" opacity=".55" filter="url(#contact)"/>

  <!-- closed end -->
  <ellipse cx="120" cy="92" rx="46" ry="13" fill="url(#cupCap)"/>
  <ellipse cx="120" cy="92" rx="46" ry="13" fill="none" stroke="#050a10" stroke-width="2"/>
  <ellipse cx="120" cy="92" rx="36" ry="9" fill="none" stroke="#dcecff" stroke-opacity=".24" stroke-width="1.3"/>
  <ellipse cx="106" cy="86" rx="20" ry="5.5" fill="#fff" opacity=".1" transform="rotate(-6 106 86)"/>
  <path d="M74 92 A46 13 0 0 0 166 92" fill="none" stroke="#76889d" stroke-opacity=".34" stroke-width="1.8"/>
</svg>
